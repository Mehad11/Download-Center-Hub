<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Download Center Hub — Elsewedy Electric</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--ink:#f4f4f5;--mute:#8b8d94;--line:rgba(255,255,255,.16);--red:#c8242c;--red2:#e03640;--H:calc(72px + env(safe-area-inset-top,0px));--ease:cubic-bezier(.2,.7,.2,1);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{background:radial-gradient(ellipse at 50% 45%,#1a1b20 0,var(--bg) 70%);color:var(--ink);font-family:Montserrat,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px) 0 0/56px 56px,linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px) 0 0/56px 56px;-webkit-mask:radial-gradient(ellipse at 50% 45%,#000 10%,transparent 72%);mask:radial-gradient(ellipse at 50% 45%,#000 10%,transparent 72%)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--red2);outline-offset:3px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.m-home #c{cursor:pointer}.m-regions #c{cursor:grab}
#ld{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .9s ease}
#ld.out{opacity:0;pointer-events:none}
#ld img{width:clamp(180px,24vw,280px);animation:in 1s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.trk{width:clamp(150px,20vw,220px);height:2px;background:rgba(255,255,255,.14);overflow:hidden}
#bar{height:100%;background:var(--red2);transform:scaleX(0);transform-origin:left;transition:transform 1.2s var(--ease)}
header{position:fixed;top:0;left:0;right:0;height:var(--H);padding:env(safe-area-inset-top,0px) clamp(16px,3vw,32px) 0;display:flex;align-items:center;gap:10px;z-index:6}
header img{height:34px;width:auto;margin-right:auto;cursor:pointer}
.pill{height:40px;padding:0 18px;border:1px solid var(--line);border-radius:999px;background:rgba(10,10,11,.55);font-size:12px;font-weight:500;letter-spacing:.06em;display:inline-flex;align-items:center;gap:10px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:background .25s,opacity .5s,transform .6s var(--ease)}
.pill:hover{background:rgba(255,255,255,.1)}
#bk{opacity:0;transform:translateX(12px);pointer-events:none}
.m-sectors #bk,.m-regions #bk{opacity:1;transform:none;pointer-events:auto}
.ey{display:flex;align-items:center;gap:12px;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.ey i{width:8px;height:8px;background:var(--red2)}
#hm{position:fixed;top:calc(var(--H) + 6px);left:0;right:0;text-align:center;z-index:4;pointer-events:none;transition:opacity .6s,transform .8s var(--ease)}
#hm .ey{justify-content:center}
#hm h1{margin:14px 0 0;font-weight:300;font-size:clamp(22px,3.4vw,44px);letter-spacing:-.01em}
#hm h1 b{font-weight:600}
.m-sectors #hm,.m-regions #hm{opacity:0;transform:translateY(-16px)}
#ft{position:fixed;top:calc(var(--H) + 10px);left:clamp(20px,5vw,64px);z-index:4;pointer-events:none;max-width:min(300px,60vw)}
#ft>*{opacity:0;transform:translateY(14px);transition:opacity .7s var(--ease) .4s,transform .9s var(--ease) .4s}
.m-sectors #ft>*,.m-regions #ft>*{opacity:1;transform:none}
#ft h2{margin:14px 0 8px;font-weight:300;font-size:clamp(26px,3.6vw,46px);line-height:1.08;letter-spacing:-.01em}
#ft h2 b{font-weight:600}
#ft p{margin:0;color:var(--mute);font-size:13px;line-height:1.6}
.cap{position:fixed;z-index:4;text-align:center;transition:opacity .6s,transform .5s var(--ease),filter .4s;padding:10px 16px}
.cap .n{color:var(--red2);font-size:12px;font-weight:600;letter-spacing:.18em}
.cap .t{display:block;margin:6px 0 4px;font-size:clamp(17px,2vw,26px);font-weight:500;letter-spacing:.01em}
.cap .s{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:inline-flex;align-items:center;gap:10px}
.cap .s::after{content:"";width:22px;height:1px;background:currentColor;transition:width .5s var(--ease)}
.cap:hover .s::after,.cap.hv .s::after{width:44px}
.cap:hover .s,.cap.hv .s{color:var(--ink)}
.cap.a{left:25%;bottom:calc(7vh + env(safe-area-inset-bottom,0px));transform:translateX(-50%)}
.cap.b{left:75%;bottom:calc(7vh + env(safe-area-inset-bottom,0px));transform:translateX(-50%)}
.m-sectors .cap,.m-regions .cap{opacity:0;pointer-events:none;filter:blur(6px)}
@media (max-aspect-ratio:19/20){.cap.a{left:50%;bottom:auto;top:37%}.cap.b{left:50%;bottom:auto;top:46.5%}}
#lb{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.sl,.rl{position:absolute;left:0;top:0;white-space:nowrap;pointer-events:none}
.sl{display:flex;align-items:center;gap:12px;opacity:0;font-size:clamp(13px,1.6vw,20px);font-weight:500;letter-spacing:.01em;transition:opacity .5s,color .3s;padding:8px 0}
.sl i{width:clamp(26px,4vw,56px);height:1px;background:linear-gradient(90deg,var(--red2),rgba(255,255,255,.35));transform:scaleX(0);transform-origin:left;transition:transform .8s var(--ease)}
.sl b{color:var(--red2);font-size:.6em;font-weight:600;letter-spacing:.14em}
.sl span{background:linear-gradient(var(--red2),var(--red2)) 0 100%/0 1px no-repeat;padding-bottom:3px;transition:background-size .5s var(--ease),text-shadow .4s}
.m-sectors .sl{opacity:.82;pointer-events:auto;transition-delay:calc(var(--d)*90ms + .45s)}
.m-sectors .sl i{transform:none;transition-delay:calc(var(--d)*90ms + .45s)}
.m-sectors .sl.hv,.m-sectors .sl:hover{opacity:1;color:#fff;transition-delay:0s}
.sl.hv span,.sl:hover span{background-size:100% 1px;text-shadow:0 0 26px rgba(224,54,64,.75)}
.rl{display:flex;align-items:center;gap:9px;padding:7px 14px 7px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(10,10,11,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:0;transition:background .3s,border-color .3s}
.rl u{width:6px;height:6px;border-radius:50%;background:var(--red2);box-shadow:0 0 10px var(--red2)}
.rl.hv,.rl:hover{background:rgba(200,36,44,.35);border-color:var(--red2)}
.rail{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 16px;opacity:0;transform:translateY(20px);pointer-events:none;transition:opacity .6s,transform .9s var(--ease)}
.m-regions .rail{opacity:1;transform:none;pointer-events:auto;transition-delay:.5s}
.ch{padding:9px 15px;border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);background:rgba(10,10,11,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:all .3s}
.ch:hover,.ch.hv{color:#fff;border-color:var(--red2);background:rgba(200,36,44,.25)}
#pn{position:fixed;z-index:7;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100vw - 32px));transform:translate(-50%,24px);opacity:0;pointer-events:none;padding:18px 52px 18px 22px;border:1px solid var(--line);border-left:3px solid var(--red2);border-radius:14px;background:rgba(14,14,17,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 30px 70px -20px #000;transition:opacity .5s,transform .7s var(--ease)}
#pn.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#pn small{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--red2);font-weight:600}
#pn h3{margin:6px 0 4px;font-size:18px;font-weight:600}
#pn p{margin:0;font-size:12px;color:var(--mute);line-height:1.6}
#px{position:absolute;top:12px;right:14px;width:30px;height:30px;font-size:22px;color:var(--mute)}
#px:hover{color:#fff}
@media (max-width:640px){header img{height:28px}.pill{height:36px;padding:0 14px}}
</style>
</head>
